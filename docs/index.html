<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>アイデアBANK｜労働条件改善アイデア × 組合ポイント</title>
<style>
  :root {
    --bg: #0f1226; --card: #1a1f3d; --card2: #232a52; --line: #2e3768;
    --txt: #eef1ff; --muted: #9aa4d6; --accent: #7c5cff; --accent2: #26d0a8;
    --gold: #ffcc4d; --silver: #cfd6ff; --bronze: #e0955f;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6ff; --card:#fff; --card2:#f0f2ff; --line:#e2e6ff;
      --txt:#161a33; --muted:#5b6390; --accent:#6a45ff; --accent2:#12a883; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  header.hero { text-align:center; padding:28px 0 8px; }
  .logo { font-size:2rem; font-weight:800; letter-spacing:.02em; }
  .logo .b { color:var(--accent); }
  .tag { color:var(--muted); margin-top:4px; }
  .cta { display:inline-flex; gap:8px; align-items:center; margin-top:18px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    text-decoration:none; padding:12px 22px; border-radius:999px; font-weight:700;
    box-shadow:0 8px 24px rgba(124,92,255,.35); }
  .cta:active { transform:translateY(1px); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:28px 0; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center; }
  .stat .n { font-size:1.7rem; font-weight:800; }
  .stat .l { color:var(--muted); font-size:.8rem; }
  h2 { font-size:1.15rem; margin:34px 0 12px; display:flex; align-items:center; gap:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} .stats{grid-template-columns:1fr 1fr;} }
  .board { display:flex; flex-direction:column; gap:12px; }
  .idea { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; text-decoration:none; display:block; transition:.15s; }
  .idea:hover { border-color:var(--accent); transform:translateY(-1px); }
  .idea .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .idea .title { font-weight:700; }
  .pts { white-space:nowrap; font-weight:800; color:var(--accent2); }
  .pts small { color:var(--muted); font-weight:600; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; color:var(--muted); font-size:.8rem; align-items:center; }
  .chip { background:var(--card2); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  .chip.s-採用,.chip.s-実装済み { background:rgba(38,208,168,.15); border-color:var(--accent2); color:var(--accent2); }
  .chip.s-検討中 { background:rgba(255,204,77,.15); border-color:var(--gold); color:var(--gold); }
  ol.rank { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  ol.rank li { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .medal { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:800; background:var(--card2); flex:none; }
  li:nth-child(1) .medal{ background:var(--gold); color:#3a2c00; }
  li:nth-child(2) .medal{ background:var(--silver); color:#1a1f3d; }
  li:nth-child(3) .medal{ background:var(--bronze); color:#2a1400; }
  .rank .who { font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; }
  .rank .sub { color:var(--muted); font-size:.78rem; font-weight:500; }
  .rank .p { font-weight:800; color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:40px; }
  .empty { color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:24px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logo">アイデア<span class="b">BANK</span></div>
    <div class="tag">気づいたことを投稿して、労働組合ポイントを貯めよう ⚡</div>
    <a class="cta" id="submit" href="#">💡 アイデアを投稿する</a>
  </header>

  <section class="stats" id="stats"></section>

  <div class="grid">
    <div>
      <h2>🏆 ポイントランキング</h2>
      <ol class="rank" id="rank"></ol>
    </div>
    <div>
      <h2>📥 みんなのアイデア</h2>
      <div class="board" id="board"></div>
    </div>
  </div>

  <footer>
    <div>更新: <span id="updated">-</span>／ データ: <a href="./data/ideas.json">ideas.json</a>・<a href="./data/points.json">points.json</a></div>
    <div style="margin-top:6px">Powered by GitHub Issues + GitHub Actions</div>
  </footer>
</div>

<script>
// リポジトリを自動判定して投稿URL（エンドポイント）を組み立てる。
// GitHub Pages では <owner>.github.io/<repo>/ の形になる。
(function () {
  const parts = location.pathname.split('/').filter(Boolean);
  const owner = location.hostname.split('.')[0];
  const repo = parts[0] || 'NS-idea-BANK';
  const base = location.hostname.endsWith('github.io') ? `${owner}/${repo}` : 'NS-user/NS-idea-BANK';
  document.getElementById('submit').href = `https://github.com/${base}/issues/new?template=idea.yml`;
})();

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jp = (iso) => iso ? new Date(iso).toLocaleString('ja-JP', { dateStyle:'medium', timeStyle:'short' }) : '-';

async function load(name) {
  try { const r = await fetch(`./data/${name}.json?_=${Date.now()}`); return await r.json(); }
  catch { return null; }
}

(async function () {
  const [ideasDoc, pointsDoc, summary] = await Promise.all([load('ideas'), load('points'), load('summary')]);
  const ideas = (ideasDoc && ideasDoc.ideas) || [];
  const board = (pointsDoc && pointsDoc.leaderboard) || [];

  const S = summary || {};
  document.getElementById('stats').innerHTML = [
    ['アイデア', S.totalIdeas ?? ideas.length],
    ['参加者', S.totalContributors ?? board.length],
    ['採用・実装', S.adoptedIdeas ?? '-'],
    ['累計ポイント', S.totalPoints ?? '-'],
  ].map(([l, n]) => `<div class="stat"><div class="n">${esc(n)}</div><div class="l">${l}</div></div>`).join('');

  document.getElementById('updated').textContent = jp((summary && summary.generatedAt) || (ideasDoc && ideasDoc.generatedAt));

  const rank = document.getElementById('rank');
  rank.innerHTML = board.length ? board.map(r => `
    <li>
      <div class="medal">${r.rank}</div>
      <div class="who">${esc(r.user)}<div class="sub">${r.ideas}件投稿・採用${r.adopted}件</div></div>
      <div class="p">${r.points} pt</div>
    </li>`).join('') : `<div class="empty">まだ参加者がいません。最初の投稿者になろう！</div>`;

  const bd = document.getElementById('board');
  bd.innerHTML = ideas.length ? ideas.map(i => `
    <a class="idea" href="${esc(i.url)}" ${i.url && i.url !== '#' ? 'target="_blank" rel="noopener"' : ''}>
      <div class="top">
        <div class="title">${esc(i.title)}</div>
        <div class="pts">${i.points}<small> pt</small></div>
      </div>
      <div class="meta">
        <span class="chip">🏷️ ${esc(i.category)}</span>
        <span class="chip s-${esc(i.status)}">${esc(i.status)}</span>
        <span>👤 ${esc(i.author)}</span>
        <span>👍 ${i.reactions}</span>
      </div>
    </a>`).join('') : `<div class="empty">まだアイデアがありません。<br>「アイデアを投稿する」から気づきをシェアしよう！</div>`;
})();
</script>
</body>
</html>
