<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>アイデアBANK｜アイデア通帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --paper:#F4EFE3; --paper2:#EDE6D6; --card:#FBF8F1; --line:#DCD2BE;
    --ink:#1B2A3A; --ink2:#54637A; --seal:#D14733; --seal-ink:#fff;
    --gold:#C79A3A; --silver:#9AA6B2; --bronze:#B57A48; --ai:#2C5578;
    --shadow:0 1px 0 rgba(27,42,58,.04), 0 10px 30px -18px rgba(27,42,58,.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#141C25; --paper2:#101821; --card:#1B2530; --line:#2B3846;
      --ink:#EDE7D8; --ink2:#9DAABb; --seal:#E7644E; --seal-ink:#0c1218;
      --gold:#E0B457; --silver:#AEB9C6; --bronze:#CB8A55; --ai:#7FB0D6;
      --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 34px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141C25; --paper2:#101821; --card:#1B2530; --line:#2B3846;
    --ink:#EDE7D8; --ink2:#9DAABb; --seal:#E7644E; --seal-ink:#0c1218;
    --gold:#E0B457; --silver:#AEB9C6; --bronze:#CB8A55; --ai:#7FB0D6;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 34px -18px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --paper:#F4EFE3; --paper2:#EDE6D6; --card:#FBF8F1; --line:#DCD2BE;
    --ink:#1B2A3A; --ink2:#54637A; --seal:#D14733; --seal-ink:#fff;
    --gold:#C79A3A; --silver:#9AA6B2; --bronze:#B57A48; --ai:#2C5578;
    --shadow:0 1px 0 rgba(27,42,58,.04), 0 10px 30px -18px rgba(27,42,58,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(1200px 500px at 80% -8%, color-mix(in oklab, var(--seal) 8%, transparent), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1;
  }
  .wrap{max-width:1060px; margin:0 auto; padding:clamp(18px,4vw,40px) 18px 72px;}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
  .book{
    position:relative; background:linear-gradient(160deg, var(--ink), color-mix(in oklab,var(--ink) 82%, #000));
    color:#F4EFE3; border-radius:16px; padding:26px clamp(20px,4vw,40px);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .book:before{ content:""; position:absolute; inset:16px auto 16px 14px; width:2px;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.28) 0 7px, transparent 7px 15px);}
  .book .eyebrow{ letter-spacing:.42em; font-size:.66rem; text-transform:uppercase; color:color-mix(in oklab,#F4EFE3 68%, transparent); padding-left:18px;}
  .book h1{ margin:.15em 0 .1em; padding-left:18px; font-size:clamp(1.7rem,5vw,2.5rem); font-weight:900; letter-spacing:.06em; text-wrap:balance;}
  .book h1 .b{ color:var(--gold);}
  .book .branch{ padding-left:18px; color:color-mix(in oklab,#F4EFE3 80%, transparent); font-size:.92rem;}
  .seal-badge{ position:absolute; top:20px; right:22px; width:74px; height:74px; display:grid; place-items:center;
    border:2.5px solid var(--seal); border-radius:12px; color:var(--seal);
    transform:rotate(-9deg); font-weight:900; text-align:center; line-height:1.1; font-size:.72rem;
    background:color-mix(in oklab, var(--seal) 12%, transparent); letter-spacing:.08em;}
  .seal-badge b{font-size:1.15rem; display:block;}
  .ledger{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin:14px 0 6px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
  .ledger .cell{ padding:16px 18px; border-right:1px dashed var(--line);}
  .ledger .cell:last-child{border-right:0;}
  .ledger .k{ font-size:.72rem; color:var(--ink2); letter-spacing:.08em;}
  .ledger .v{ font-size:clamp(1.4rem,3.4vw,2rem); font-weight:800; margin-top:2px;}
  .ledger .v small{ font-size:.62em; color:var(--ink2); font-weight:600; margin-left:2px;}
  @media (max-width:640px){ .ledger{grid-template-columns:1fr 1fr;} .ledger .cell:nth-child(2){border-right:0;} .ledger .cell:nth-child(1),.ledger .cell:nth-child(2){border-bottom:1px dashed var(--line);} }
  .cta-row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:18px 0 6px;}
  .cta{ display:inline-flex; gap:9px; align-items:center; text-decoration:none; font-weight:800;
    background:var(--seal); color:var(--seal-ink); padding:12px 22px; border-radius:999px;
    box-shadow:0 10px 22px -10px color-mix(in oklab,var(--seal) 80%, transparent); letter-spacing:.02em;}
  .cta:active{transform:translateY(1px);}
  .cta.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .note{ color:var(--ink2); font-size:.82rem;}
  h2{ font-size:.82rem; letter-spacing:.22em; text-transform:uppercase; color:var(--ink2);
    margin:32px 0 12px; display:flex; align-items:center; gap:10px;}
  h2:after{content:""; flex:1; height:1px; background:var(--line);}
  .grid{ display:grid; grid-template-columns:0.82fr 1.18fr; gap:26px; align-items:start;}
  @media (max-width:860px){ .grid{grid-template-columns:1fr;} }
  .rank{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .rank li{ display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:13px 15px; box-shadow:var(--shadow);}
  .medal{ flex:none; width:42px; height:42px; display:grid; place-items:center; font-weight:900;
    border-radius:50%; color:#fff; background:var(--ink2); position:relative; font-size:1.05rem;
    box-shadow:inset 0 0 0 2px color-mix(in oklab,#000 12%, transparent);}
  .rank li:nth-child(1) .medal{ background:var(--gold); color:#3a2b06;}
  .rank li:nth-child(2) .medal{ background:var(--silver); color:#1b2530;}
  .rank li:nth-child(3) .medal{ background:var(--bronze); color:#2a1608;}
  .rank .who{flex:1; min-width:0;}
  .rank .name{ font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank .sub{ font-size:.76rem; color:var(--ink2);}
  .rank .pt{ font-weight:900; font-size:1.15rem; color:var(--seal);}
  .rank .pt small{font-size:.6em; color:var(--ink2); font-weight:700; margin-left:1px;}
  .board{ display:flex; flex-direction:column; gap:0; background:var(--card); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
  .entry{ display:block; text-decoration:none; color:inherit; padding:15px 18px; border-top:1px dashed var(--line); transition:background .15s;}
  .entry:first-child{border-top:0;}
  .entry:hover{ background:color-mix(in oklab,var(--seal) 5%, transparent);}
  .entry .top{ display:flex; align-items:baseline; gap:10px;}
  .entry .ttl{ font-weight:800; color:var(--ink); flex:0 1 auto;}
  .leader{ flex:1; border-bottom:1.5px dotted var(--line); transform:translateY(-3px); min-width:16px;}
  .stamp{ flex:none; display:inline-grid; place-items:center; min-width:66px; height:34px; padding:0 10px;
    border:2px solid var(--seal); color:var(--seal); border-radius:8px; font-weight:900; transform:rotate(-3deg);
    background:color-mix(in oklab,var(--seal) 9%, transparent); letter-spacing:.02em;}
  .stamp small{font-size:.6em; font-weight:800; margin-left:1px;}
  .entry .meta{ display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; align-items:center; font-size:.78rem; color:var(--ink2);}
  .chip{ border:1px solid var(--line); border-radius:999px; padding:2px 10px; background:var(--paper2);}
  .chip.st{ font-weight:700;}
  .chip.st.採用,.chip.st.実装済み{ color:#1f7a5c; border-color:#1f7a5c; background:color-mix(in oklab,#1f7a5c 10%, transparent);}
  .chip.st.検討中{ color:#9a7420; border-color:var(--gold); background:color-mix(in oklab,var(--gold) 12%, transparent);}
  .chip.st.受付{ color:var(--ai); border-color:var(--ai); background:color-mix(in oklab,var(--ai) 10%, transparent);}
  .who-tag{ margin-left:auto; font-weight:600;}
  .empty{ padding:26px; text-align:center; color:var(--ink2);}
  footer{ margin-top:40px; text-align:center; color:var(--ink2); font-size:.78rem; line-height:1.8;}
  footer a{color:var(--ai);}
  @media (prefers-reduced-motion:no-preference){
    .entry,.rank li,.ledger{ animation:rise .5s cubic-bezier(.2,.7,.2,1) both;}
    .rank li:nth-child(2){animation-delay:.05s} .rank li:nth-child(3){animation-delay:.1s}
    @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="book">
    <div class="seal-badge"><span>組合<br><b>POINT</b><br>通帳</span></div>
    <div class="eyebrow">Labor-Union Idea Bank</div>
    <h1>アイデア<span class="b">BANK</span></h1>
    <div class="branch">久喜支部 2026-2027 ／ 労働条件改善アイデア</div>
  </div>

  <section class="ledger num" id="ledger"></section>

  <div class="cta-row">
    <a class="cta" id="submit" href="#">🖊 アイデアを投稿する</a>
    <a class="cta ghost" id="listlink" href="#">📚 GitHubで全件を見る</a>
    <span class="note">投稿するだけで <b>+10pt</b>。検討中→採用→実装で加点、👍でも貯まる。</span>
  </div>

  <div class="grid">
    <div>
      <h2>ポイントランキング</h2>
      <ol class="rank num" id="rank"></ol>
    </div>
    <div>
      <h2>アイデア台帳</h2>
      <div class="board" id="board"></div>
    </div>
  </div>

  <footer>
    <div>更新: <span id="updated">-</span> ／ データ: <a href="./data/ideas.json">ideas.json</a>・<a href="./data/points.json">points.json</a></div>
    <div>GitHub Issues に投稿 → GitHub Actions が自動採点 → この台帳へ記帳。</div>
  </footer>
</div>

<script>
// リポジトリを自動判定して各リンク（エンドポイント）を組み立てる
const REPO = (function(){
  const parts = location.pathname.split('/').filter(Boolean);
  if (location.hostname.endsWith('github.io')) {
    return `${location.hostname.split('.')[0]}/${parts[0] || 'NS-idea-BANK'}`;
  }
  return 'NS-user/NS-idea-BANK';
})();
document.getElementById('submit').href = `https://github.com/${REPO}/issues/new?template=idea.yml`;
document.getElementById('listlink').href = `https://github.com/${REPO}/issues?q=is%3Aissue+label%3Aidea`;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jp = iso => iso ? new Date(iso).toLocaleString('ja-JP', {dateStyle:'medium', timeStyle:'short'}) : '-';
const load = async n => { try { const r = await fetch(`./data/${n}.json?_=${Date.now()}`); return await r.json(); } catch { return null; } };

(async function(){
  const [ideasDoc, pointsDoc, summary] = await Promise.all([load('ideas'), load('points'), load('summary')]);
  const ideas = (ideasDoc && ideasDoc.ideas) || [];
  const board = (pointsDoc && pointsDoc.leaderboard) || [];
  const S = summary || {};

  document.getElementById('ledger').innerHTML = [
    ['アイデア', S.totalIdeas ?? ideas.length, '件'],
    ['参加者', S.totalContributors ?? board.length, '人'],
    ['採用・実装', S.adoptedIdeas ?? 0, '件'],
    ['累計ポイント', (S.totalPoints ?? 0).toLocaleString('ja-JP'), 'pt'],
  ].map(([k,v,u]) => `<div class="cell"><div class="k">${k}</div><div class="v">${esc(v)}<small>${u}</small></div></div>`).join('');

  document.getElementById('updated').textContent = jp((summary && summary.generatedAt) || (ideasDoc && ideasDoc.generatedAt));

  document.getElementById('rank').innerHTML = board.length ? board.map(r => `
    <li>
      <div class="medal">${r.rank}</div>
      <div class="who"><div class="name">${esc(r.user)}</div><div class="sub">${r.ideas}件投稿・採用${r.adopted}件</div></div>
      <div class="pt">${(r.points||0).toLocaleString('ja-JP')}<small>pt</small></div>
    </li>`).join('') : `<li class="empty" style="justify-content:center">まだ参加者がいません。最初の投稿者になろう！</li>`;

  document.getElementById('board').innerHTML = ideas.length ? ideas.map(i => `
    <a class="entry" href="${esc(i.url)}"${i.url && i.url !== '#' ? ' target="_blank" rel="noopener"' : ''}>
      <div class="top">
        <span class="ttl">${esc(i.title)}</span>
        <span class="leader"></span>
        <span class="stamp">${(i.points||0).toLocaleString('ja-JP')}<small>pt</small></span>
      </div>
      <div class="meta">
        <span class="chip">🏷 ${esc(i.category)}</span>
        <span class="chip st ${esc(i.status)}">${esc(i.status)}</span>
        <span>👍 ${i.reactions}</span>
        <span class="who-tag">👤 ${esc(i.author)}</span>
      </div>
    </a>`).join('') : `<div class="empty">まだアイデアがありません。<br>「アイデアを投稿する」から気づきをシェアしよう！</div>`;
})();
</script>
</body>
</html>
